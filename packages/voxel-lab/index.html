<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>Voxel Lab — Pure Engine Playground</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', system-ui, sans-serif; }
    #canvas { width: calc(100vw - 380px); height: 100vh; display: block; }
    #panel {
      position: fixed; top: 12px; right: 12px; z-index: 10;
      background: rgba(10,10,20,0.92); color: #ccc; border: 1px solid #333;
      border-radius: 8px; padding: 16px 20px; min-width: 260px; width: 352px; max-height: calc(100vh - 24px); overflow: auto;
      font-size: 13px; line-height: 1.6;
      backdrop-filter: blur(8px);
    }
    #panel h2 { font-size: 15px; margin: 0 0 10px; color: #e0c080; }
    #panel label { display: block; margin: 6px 0 2px; color: #999; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    #panel select, #panel input[type=range] { width: 100%; margin-bottom: 6px; }
    #panel input[type=range] { accent-color: #c08040; }
    #stats { margin-top: 10px; padding-top: 8px; border-top: 1px solid #333; color: #8a8; font-size: 12px; }
    #stats span { color: #ad0; font-weight: bold; }
    #tabs { flex-wrap: wrap; display: flex; gap: 4px; margin-bottom: 12px; }
    #tabs button {
      flex: 1; padding: 5px 8px; border: 1px solid #444; background: #1a1a2e;
      color: #888; border-radius: 4px; cursor: pointer; font-size: 11px;
    }
    #tabs button.active { background: #2a2a3e; color: #e0c080; border-color: #c08040; }
    @media (max-width: 760px) { #canvas { width: 100vw; } #panel { width: 260px; max-height: 45vh; } }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="panel">
    <p id="backend-status">Starting renderer…</p>
    <div id="tabs">
      <button id="tab-ritual">Ritual</button>
      <button id="tab-material">Materials</button>
      <button id="tab-greedy" class="active">Greedy</button>
      <button id="tab-models">Models</button>
      <button id="tab-kit">Kit</button>
      <button id="tab-terrain">Terrain</button>
      <button id="tab-recipe">Recipe</button>
      <button id="tab-character">Character</button>
    </div>
    <div id="tab-content"></div>
    <details><summary>Device verification</summary>
      <p>Use a real device. Keep the same fixture, view and resolution for both backends.</p>
      <button id="benchmark-run">Measure 60 warmup + 180 frames</button>
      <button id="benchmark-save" disabled>Download result JSON</button>
      <pre id="benchmark-result" style="white-space:pre-wrap"></pre>
    </details>
    <div id="stats">
      <div>Triangles: <span id="stat-tri">0</span></div>
      <div>Voxels: <span id="stat-vox">0</span></div>
      <div>Meshing: <span id="stat-mesh">—</span></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
